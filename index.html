<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coaching Intake</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0A0C;
    --card:#F5F3EE;
    --card-alt:#EAE7DF;
    --ink:#111114;
    --ink-mute:#6B6B6F;
    --red:#FF1E3C;
    --yellow:#FFC700;
    --line:#D8D4C9;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    background-image:
      repeating-linear-gradient(135deg, rgba(255,30,60,0.035) 0px, rgba(255,30,60,0.035) 2px, transparent 2px, transparent 40px);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:22px 14px 60px;
  }
  .app{ width:100%; max-width:460px; }

  .brand{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-bottom:16px;
    padding:0 2px;
  }
  .brand .name{
    font-family:'Anton',sans-serif;
    font-size:16px;
    letter-spacing:0.3px;
    color:#fff;
    text-transform:uppercase;
    line-height:1.15;
  }
  .brand .name .dot{color:var(--red);}
  .set-tracker{
    font-family:'Anton',sans-serif;
    font-size:12px;
    letter-spacing:2px;
    color:var(--yellow);
    text-transform:uppercase;
  }

  .leds{
    display:flex;
    gap:5px;
    margin-bottom:16px;
  }
  .led{
    height:6px;
    flex:1;
    background:rgba(255,255,255,0.12);
    border-radius:2px;
    position:relative;
    overflow:hidden;
  }
  .led.done::after{ content:''; position:absolute; inset:0; background:var(--red); }
  .led.current::after{ content:''; position:absolute; inset:0; background:var(--yellow); }

  .card{
    background:var(--card);
    border-radius:4px;
    padding:30px 24px 26px;
    min-height:340px;
    display:flex;
    flex-direction:column;
    position:relative;
    box-shadow:0 20px 50px rgba(0,0,0,0.45);
  }
  .card::before{
    content:'';
    position:absolute;
    top:0; left:0; right:0;
    height:6px;
    background:linear-gradient(90deg, var(--red) 0%, var(--red) 60%, var(--yellow) 60%, var(--yellow) 100%);
  }

  .set-label{
    font-family:'Anton',sans-serif;
    font-size:13px;
    letter-spacing:3px;
    color:var(--red);
    margin-bottom:4px;
    text-transform:uppercase;
  }
  h2{
    font-family:'Anton',sans-serif;
    font-weight:400;
    font-size:30px;
    letter-spacing:0.2px;
    margin:0 0 6px;
    text-transform:uppercase;
    line-height:1.05;
    color:var(--ink);
  }
  .sub{
    color:var(--ink-mute);
    font-size:13px;
    margin-bottom:24px;
    line-height:1.5;
    padding-bottom:16px;
    border-bottom:2px solid var(--line);
  }

  .q{ margin-bottom:22px; }
  .q label{
    display:block;
    font-size:14.5px;
    font-weight:700;
    margin-bottom:9px;
    line-height:1.35;
    color:var(--ink);
  }
  .q .hint{
    color:var(--ink-mute);
    font-size:11.5px;
    font-weight:400;
    display:block;
    margin-top:3px;
    font-style:italic;
  }

  input[type=text], input[type=number], textarea{
    width:100%;
    background:#fff;
    border:2px solid var(--line);
    border-radius:6px;
    padding:12px 13px;
    color:var(--ink);
    font-family:'Inter',sans-serif;
    font-size:14.5px;
    resize:vertical;
    transition:border-color .15s;
  }
  textarea{ min-height:78px; }
  input:focus, textarea:focus{
    outline:none;
    border-color:var(--red);
  }

  .pills{ display:flex; flex-wrap:wrap; gap:8px; }
  .pill{
    padding:9px 15px;
    border-radius:3px;
    border:2px solid var(--ink);
    background:transparent;
    color:var(--ink);
    font-size:13px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.3px;
    cursor:pointer;
    transition:.12s;
    user-select:none;
  }
  .pill:hover{ border-color:var(--red); color:var(--red); }
  .pill.selected{
    background:var(--ink);
    border-color:var(--ink);
    color:var(--yellow);
  }

  .scale-row{ display:flex; gap:6px; }
  .scale-btn{
    flex:1;
    aspect-ratio:1;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:4px;
    border:2px solid var(--ink);
    background:transparent;
    color:var(--ink);
    font-family:'Anton',sans-serif;
    font-size:15px;
    cursor:pointer;
    transition:.12s;
  }
  .scale-btn.selected{
    background:var(--red);
    border-color:var(--red);
    color:#fff;
  }
  .scale-caption{
    display:flex;
    justify-content:space-between;
    color:var(--ink-mute);
    font-size:10.5px;
    margin-top:6px;
    text-transform:uppercase;
    letter-spacing:0.5px;
  }

  .nav{ display:flex; gap:10px; margin-top:auto; padding-top:24px; }
  .btn{
    flex:1;
    padding:15px;
    border-radius:5px;
    border:none;
    font-family:'Anton',sans-serif;
    font-size:16px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    cursor:pointer;
    transition:.15s;
  }
  .btn-primary{
    background:var(--red);
    color:#fff;
  }
  .btn-primary:hover{ filter:brightness(1.1); }
  .btn-primary:active{ transform:scale(0.98); }
  .btn-ghost{
    background:transparent;
    border:2px solid var(--ink);
    color:var(--ink);
    flex:0 0 90px;
  }
  .btn-ghost:hover{ background:var(--ink); color:#fff; }

  .required-flag{
    background:var(--yellow);
    color:var(--ink);
    font-size:9.5px;
    font-weight:800;
    padding:2px 6px;
    border-radius:2px;
    margin-left:6px;
    letter-spacing:0.5px;
    text-transform:uppercase;
    vertical-align:middle;
  }

  .done-screen{ text-align:center; padding:50px 10px 30px; }
  .done-screen .big{
    font-family:'Anton',sans-serif;
    font-size:40px;
    color:var(--red);
    margin-bottom:10px;
    text-transform:uppercase;
    letter-spacing:1px;
  }
  .done-screen p{ color:var(--ink-mute); font-size:14px; line-height:1.6; max-width:320px; margin:0 auto; }

  .coach-link{
    display:table;
    margin:20px auto 0;
    padding:8px 16px;
    font-size:11px;
    font-weight:700;
    color:var(--yellow);
    border:1.5px solid rgba(255,199,0,0.5);
    border-radius:20px;
    cursor:pointer;
    letter-spacing:1px;
    text-transform:uppercase;
    font-family:'Inter',sans-serif;
    transition:.15s;
  }
  .coach-link:hover{ background:rgba(255,199,0,0.12); border-color:var(--yellow); }

  .err{ color:var(--red); font-size:12px; margin-top:6px; font-weight:600; }
</style>
</head>
<body>
<div class="app" id="app"></div>

<script src="/shared/sections.js"></script>
<script>
let current = 0;
let answers = {};
let error = '';

// Only update the data model — do NOT re-render on every keystroke.
// Re-rendering on input was destroying and recreating the <input>,
// which kicked the cursor out after every character.
function saveAnswerSilent(id, val){
  answers[id] = val;
  error = '';
}
function saveAnswerAndRerender(id, val){
  answers[id] = val;
  error = '';
  render();
}

function validateSection(){
  const sec = SECTIONS[current];
  for(const q of sec.questions){
    if(q.required && !answers[q.id]){
      error = 'Please fill in: ' + q.label;
      return false;
    }
  }
  return true;
}

function renderQuestion(q){
  const val = answers[q.id] || '';
  let inner = '';
  if(q.type === 'text' || q.type === 'number'){
    inner = `<input type="${q.type}" value="${val.toString().replace(/"/g,'&quot;')}" oninput="saveAnswerSilent('${q.id}', this.value)"/>`;
  } else if(q.type === 'textarea'){
    inner = `<textarea oninput="saveAnswerSilent('${q.id}', this.value)">${val}</textarea>`;
  } else if(q.type === 'pills'){
    inner = `<div class="pills">${q.options.map(o => `<div class="pill ${val===o?'selected':''}" onclick="saveAnswerAndRerender('${q.id}','${o}')">${o}</div>`).join('')}</div>`;
  } else if(q.type === 'scale'){
    let btns = '';
    for(let i=q.min; i<=q.max; i++){
      btns += `<div class="scale-btn ${val==i?'selected':''}" onclick="saveAnswerAndRerender('${q.id}',${i})">${i}</div>`;
    }
    inner = `<div class="scale-row">${btns}</div><div class="scale-caption"><span>${q.min}</span><span>${q.max}</span></div>`;
  }
  return `<div class="q">
    <label>${q.label}${q.required?'<span class="required-flag">required</span>':''}${q.hint?`<span class="hint">${q.hint}</span>`:''}</label>
    ${inner}
  </div>`;
}

async function submitForm(){
  try{
    const res = await fetch('/api/submissions', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ answers })
    });
    if(!res.ok){
      error = 'Something went wrong saving your response. Please try again.';
      render();
      return;
    }
    current = 'done';
    render();
  } catch(e){
    error = 'Something went wrong saving your response. Please try again.';
    render();
  }
}

function next(){
  if(!validateSection()){ render(); return; }
  if(current < SECTIONS.length - 1){
    current++;
    render();
  } else {
    submitForm();
  }
}
function back(){
  if(current > 0){ current--; error=''; render(); }
}

function render(){
  const app = document.getElementById('app');

  if(current === 'done'){
    app.innerHTML = `
      <div class="brand"><div class="name">CLIENT'S ONBOARDING FORM</div></div>
      <div class="card done-screen">
        <div class="big">Logged.</div>
        <p>Your intake is in. I'll go through everything and start building your plan — expect to hear from me within 24&ndash;48 hours.</p>
      </div>
      <a class="coach-link" href="/dashboard">Coach Dashboard</a>
    `;
    return;
  }

  const sec = SECTIONS[current];
  const total = SECTIONS.length;
  let leds = '';
  for(let i=0;i<total;i++){
    let cls = 'led';
    if(i < current) cls += ' done';
    else if(i === current) cls += ' current';
    leds += `<div class="${cls}"></div>`;
  }

  app.innerHTML = `
    <div class="brand">
      <div class="name">CLIENT'S ONBOARDING FORM</div>
      <div class="set-tracker">Set ${current+1}/${total}</div>
    </div>
    <div class="leds">${leds}</div>
    <div class="card">
      <div class="set-label">Set ${String(current+1).padStart(2,'0')}</div>
      <h2>${sec.title}</h2>
      <div class="sub">${sec.sub}</div>
      <div class="questions">${sec.questions.map(renderQuestion).join('')}</div>
      ${error ? `<div class="err">${error}</div>` : ''}
      <div class="nav">
        ${current > 0 ? `<button class="btn btn-ghost" onclick="back()">Back</button>` : ''}
        <button class="btn btn-primary" onclick="next()">${current === total-1 ? 'Submit' : 'Next'}</button>
      </div>
    </div>
    <a class="coach-link" href="/dashboard">Coach Dashboard</a>
  `;
}

render();
</script>
</body>
</html>
